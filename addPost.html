<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        
        body > header {
            background-color: #33333331;
            color: white;
            padding: 1rem;
            text-align: center;
            justify-content: space-between;
        }
        
        nav {
            display: flex;
            align-items: center;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        nav a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        nav a + a {
            border-left: 2px solid #333;
            border-radius: 0 4px 4px 0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: block;
        }
        
        main {
            flex: 1;
            display: flex;
            padding: 2rem;
            justify-content: center;
            align-items: center;
        }
        
        footer {
            background-color: #33333331;
            color: white;
            padding: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="addPost.html">Add Post</a>
        </nav>
        <a href="login.html"><img src="images/profilepicture.png" alt="Log in" class="avatar"></a>
    </header>
    
    <main>
        <p>Add a new post here.</p>
    </main>
    
    <footer>
        <p>&copy; 2026. All rights reserved.</p>
    </footer>
</body>
</html>
