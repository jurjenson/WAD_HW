<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostIt – Add Post</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="addPost.html" class="active">Add Post</a>
        </nav>
        <a href="login.html" class="profile-link" title="Log in">
            <img src="images/avatar.svg" alt="User profile" class="avatar">
        </a>
    </header>

    <main class="center-content">
        <form action="index.html" method="get" class="form-box">
            <div class="form-row">
                <label for="post-body">Post body</label>
                <textarea id="post-body" name="body" rows="5" placeholder="textarea" required></textarea>
            </div>

            <div class="form-row">
                <label for="post-file">Select file</label>
                <input type="file" id="post-file" name="file" accept="image/*">
            </div>

            <button type="submit" class="primary-button">Create post</button>
        </form>
    </main>
</body>
</html>
