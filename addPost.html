<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        /* Child selector */
        body > header {
            display: flex;
            align-items: center;
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
            justify-content: space-between;
        }
        
        nav {
            display: flex;
            align-items: center;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        nav a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* Adjacent Sibling Selector */
        nav a + a {
            border-left: 2px solid #333;
            border-radius: 0 4px 4px 0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: block;
        }
        
        main {
            flex: 1;
            display: flex;
            padding: 2rem;
            justify-content: center;
            align-items: center;
        }

        .post-form {
            width: min(100%, 560px);
            display: grid;
            gap: 1rem;
            padding: 1.5rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .post-form label {
            font-weight: 600;
        }

        .post-form input[type="file"],
        .post-form textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #bbb;
            border-radius: 4px;
            background-color: white;
            font: inherit;
        }

        .post-form textarea {
            min-height: 140px;
            resize: none;
        }

        .post-form button {
            justify-self: start;
            padding: 0.7rem 1.25rem;
            border: 0;
            border-radius: 4px;
            background-color: #333;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="addPost.html">Add Post</a>
        </nav>
        <a href="login.html"><img src="images/profilepicture.png" alt="Log in" class="avatar"></a>
    </header>
    
    <main>
        <form class="post-form" action="index.html" method="get">
            <h2>Create a post</h2>
            <label for="post-image">Photo</label>
            <input id="post-image" type="file" accept="image/*">
            <label for="post-text">Caption</label>
            <textarea id="post-text" maxlength="500" placeholder="Write a caption..."></textarea>
            <button type="submit">Post</button>
        </form>
    </main>
    
    <footer>
    </footer>

</body>
</html>
