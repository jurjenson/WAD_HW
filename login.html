<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostIt – Log in</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="addPost.html">Add Post</a>
        </nav>
        <a href="login.html" class="profile-link" title="Log in">
            <img src="images/avatar.svg" alt="User profile" class="avatar">
        </a>
    </header>

    <main class="center-content">
        <form action="index.html" method="get" class="form-box login-box">
            <h1>Welcome to PostIt</h1>
            <a href="#" class="text-link">Create an account</a>
            <p>or</p>
            <p>Please log in</p>

            <input type="email" name="email" placeholder="Email" aria-label="Email" required>
            <input type="password" name="password" placeholder="Password" aria-label="Password" required>

            <button type="submit" class="primary-button">Log in</button>
            <a href="#" class="text-link">Forget password</a>
        </form>
    </main>
</body>
</html>
