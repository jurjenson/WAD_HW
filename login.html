<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        
        body > header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        nav {
            display: flex;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        nav a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: block;
        }
        
        main {
            flex: 1;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-form {
            width: min(100%, 560px);
            display: grid;
            gap: 1rem;
            padding: 1.5rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .login-form label {
            font-weight: 600;
        }

        .login-form input:not([type="submit"]) {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #bbb;
            border-radius: 4px;
            background-color: white;
            font: inherit;
        }

        .login-form input[type="submit"] {
            justify-self: start;
            padding: 0.7rem 1.25rem;
            border: 0;
            border-radius: 4px;
            background-color: #333;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="addPost.html">Add Post</a>
        </nav>
        <a href="login.html"><img src="images/profilepicture.png" alt="Avatar" class="avatar"></a>
    </header>
    
    <main>
        <form class="login-form" action="index.html" method="get">
            <h2>Log in</h2>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <input type="submit" value="Log in">
        </form>
    </main>

    <footer>
    </footer>

</body>
</html>
