<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        
        header {
            background-color: #33333331;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        
        header a {
            color: white;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        header a:hover {
            background-color: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 4px;
        }
        
        main {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        footer {
            background-color: #33333331;
            color: white;
            padding: 2rem;
            text-align: center;
            margin: 0 1rem 1rem;
            border-radius: 8px;
        }
        
        .post {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            background-color: #f9f9f9;
        }
        
        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        
        .date {
            font-size: 0.9rem;
            color: #666;
        }
        
        .post-image {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        .post-reactions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .post-reactions button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            background-color: #e0e0e0;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .post-reactions button:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="index.html">Home</a> | <a href="addpost.html">AddPost</a></h1>
    </header>
    
    <main>
        <p>This is the main content area.</p>
        <article class="post">
            <div class="post-header">
                <img src="profilepicture.png" alt="Profile" class="profile-pic">
                <span class="date">Sept 23, 2026</span>
            </div>
            <img src="post-image.jpg" alt="Post image" class="post-image">
            <p>text</p>
            
            <div class="post-reactions">
                <button>👍 Like</button>
                <button>💬 Comment</button>
            </div>
        </article>

        <article class="post">
            <div class="post-header">
                <img src="profilepicture.png" alt="Profile" class="profile-pic">
                <span class="date">Sept 19, 2026</span>
            </div>
            <p>Test text</p></h1>
            <div class="post-reactions">
                <button>👍 Like</button>
                <button>💬 Comment</button>
            </div>
        </article>
    </main>
    
    <footer>
    </footer>
</body>
</html>
